name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & E2E Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      HUSKY: 0

    steps:
      # Step 0: Check out repo code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 0.1: Setup Node.js runtime
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 1: Dependencies download
      - name: 📦 1. Download Dependencies
        run: npm ci || npm install --legacy-peer-deps

      # Step 2: ESLint Code Quality
      - name: 🔍 2. Run ESLint
        run: npm run lint

      # Step 3: Vitest Unit Test Cases
      - name: 🧪 3. Run Unit Tests
        run: npm run test:unit

      # Step 4: Playwright E2E Tests
      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🎭 4. Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      # Step 5: Upload Playwright Report on Failure/Always
      - name: 📊 Upload Playwright Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
